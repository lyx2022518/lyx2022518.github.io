name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          ADE28D: ${{ secrets.ADE28D }}
          B8BF7F: ${{ secrets.B8BF7F }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('ADE28D', ''), os.environ.get('B8BF7F', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 46b8b5cfb15032969c30eb7c6aeabec3c8 -->', a)
          if b:
              patched = patched.replace('<!-- 6382d76ebf76e3d3366aee41 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
